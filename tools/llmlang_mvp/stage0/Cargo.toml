[package]
name = "llmlang-stage0"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
rustpython-parser = { version = "=0.4.0", default-features = false, features = ["location", "num-bigint"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full", "visit"] }
