name: Toolchain workspace prototype

on:
  workflow_call:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: research/toolchain-and-collaboration/PROTOTYPES/TOOLCHAIN-SERVER-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile prototype
        run: python -m compileall -q .
      - name: Run workspace lifecycle tests
        run: python -m unittest discover -s . -p 'test_toolchain.py' -v
