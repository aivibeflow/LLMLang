name: RT-00 RT-24 Call-Target Merge Reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rt00-rt24-call-target-reproduction.yml"
      - "research/RT-24/RT-24-CALL-TARGET-MERGE.md"
      - "research/PROTOTYPES/DEPENDENCY-GRAPH-01/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: reproduce-rt24-call-target-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up declared Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Record source identity and environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/rt24-reproduction
          {
            echo "commit=$(git rev-parse HEAD)"
            python --version
            python -c 'import sys; print(sys.version)'
            git --version
            sha256sum research/RT-24/RT-24-CALL-TARGET-MERGE.md
            sha256sum research/PROTOTYPES/DEPENDENCY-GRAPH-01/tests/test_rt24_call_target_merge.py
            sha256sum research/PROTOTYPES/DEPENDENCY-GRAPH-01/tests/test_rt24_semantic_merge_core.py
            sha256sum research/PROTOTYPES/DEPENDENCY-GRAPH-01/tests/test_rt24_merge_tree_gate.py
            sha256sum research/PROTOTYPES/DEPENDENCY-GRAPH-01/src/semantic_graph.py
            sha256sum research/PROTOTYPES/DEPENDENCY-GRAPH-01/src/semantic_dependency_index.py
          } | tee artifacts/rt24-reproduction/environment-and-inputs.txt

      - name: Reproduce exact call-target merge experiment
        working-directory: research/PROTOTYPES/DEPENDENCY-GRAPH-01
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v tests.test_rt24_call_target_merge tests.test_rt24_semantic_merge_core tests.test_rt24_merge_tree_gate 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/rt24-reproduction/rt24.log"

      - name: Hash reproduction log
        shell: bash
        run: |
          set -euo pipefail
          sha256sum artifacts/rt24-reproduction/rt24.log | tee artifacts/rt24-reproduction/log-digest.txt

      - name: Retain exact reproduction evidence
        uses: actions/upload-artifact@v4
        with:
          name: rt00-rt24-call-target-reproduction-${{ github.sha }}
          path: artifacts/rt24-reproduction/
          if-no-files-found: error
          retention-days: 90
