name: Research Reproducibility Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/research-reproducibility-smoke.yml"
      - "research/security/PROTOTYPES/RT-16-AUTHORIZATION-01/**"
      - "research/language-design/PROTOTYPES/CLI-WORKLOADS-01/**"
      - "research/security/RT-16/RT-16-THREAT-MODEL-01.md"
      - "research/language-design/RT-01/RT-01-REFERENCE-WORKLOADS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-reproduction:
    name: bounded-reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture environment and source identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/research-reproducibility
          {
            echo "repository_commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "python=$(python --version 2>&1)"
            echo "cc=$(cc --version | head -n 1)"
            echo "kernel=$(uname -srmo)"
            echo
            sha256sum \
              research/security/PROTOTYPES/RT-16-AUTHORIZATION-01/policy.py \
              research/security/PROTOTYPES/RT-16-AUTHORIZATION-01/test_policy.py \
              research/language-design/PROTOTYPES/CLI-WORKLOADS-01/run.py \
              research/language-design/PROTOTYPES/CLI-WORKLOADS-01/reference.py \
              research/language-design/PROTOTYPES/CLI-WORKLOADS-01/reference.c
          } | tee artifacts/research-reproducibility/environment-and-inputs.txt

      - name: Run RT-16 authorization decision tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover \
            -s research/security/PROTOTYPES/RT-16-AUTHORIZATION-01 \
            -p 'test_*.py' -v \
            2>&1 | tee artifacts/research-reproducibility/rt16-tests.log

      - name: Run CLI Python reference workloads
        shell: bash
        run: |
          set -euo pipefail
          python -B research/language-design/PROTOTYPES/CLI-WORKLOADS-01/run.py \
            --reference python \
            2>&1 | tee artifacts/research-reproducibility/cli-python-reference.log

      - name: Run CLI C reference workloads
        shell: bash
        run: |
          set -euo pipefail
          python -B research/language-design/PROTOTYPES/CLI-WORKLOADS-01/run.py \
            --reference c \
            2>&1 | tee artifacts/research-reproducibility/cli-c-reference.log

      - name: Preserve bounded reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-reproducibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/research-reproducibility/
          if-no-files-found: warn
          retention-days: 30
