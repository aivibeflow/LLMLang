name: RT-04 Native Reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rt04-native-reproduction.yml"
      - "research/PROTOTYPES/RT-04-01/**"
      - "research/RT-04-NATIVE-REPRODUCTION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-reproduction:
    name: native-reproduction
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.85.1"

      - name: Install the distribution SQLite library used by the scenarios
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0
          library="$(ldconfig -p | awk '$1 == "libsqlite3.so.0" { print $NF; exit }')"
          test -n "$library"
          export LLMLANG_SQLITE_LIBRARY="$library"
          echo "LLMLANG_SQLITE_LIBRARY=$library" >> "$GITHUB_ENV"
          python - <<'PY'
          import ctypes
          import os
          library = ctypes.CDLL(os.environ.get("LLMLANG_SQLITE_LIBRARY", ""))
          library.sqlite3_libversion.restype = ctypes.c_char_p
          library.sqlite3_sourceid.restype = ctypes.c_char_p
          print("SQLite", library.sqlite3_libversion().decode())
          print("source ID:", library.sqlite3_sourceid().decode())
          PY

      - name: Build the Python SQLite 3.53.1 runtime for Scenario 130
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error \
            https://www.sqlite.org/2026/sqlite-autoconf-3530100.tar.gz \
            --output sqlite-autoconf-3530100.tar.gz
          tar -xzf sqlite-autoconf-3530100.tar.gz
          cd sqlite-autoconf-3530100
          ./configure --prefix="$RUNNER_TEMP/sqlite-3.53.1" --enable-shared --disable-static
          make -j2
          make install
          echo "LLMLANG_PYTHON_SQLITE_LIBRARY=$RUNNER_TEMP/sqlite-3.53.1/lib/libsqlite3.so" >> "$GITHUB_ENV"

      - name: Run native SQLite and Rust experiments
        run: |
          python -B research/PROTOTYPES/RT-04-01/run_native_probes.py \
            --suite all \
            --output-dir artifacts/rt04-native-reproduction

      - name: Preserve native experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rt04-native-reproduction-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rt04-native-reproduction/
          if-no-files-found: warn
          retention-days: 30
