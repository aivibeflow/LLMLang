name: LLMLang Linux syscalls

on:
  pull_request:
    paths:
      - "draft/examples/**"
      - "draft/library/**"
      - "draft/server/**"
      - "draft/builtin/**"
      - "draft/stdlib/**"
      - "draft/src/library/**"
      - "draft/src/server/**"
      - "research/language-design/PROTOTYPES/CLI-WORKLOADS-01/run.py"
      - ".github/workflows/llmlang-linux-syscalls.yml"
  push:
    branches: [main]
    paths:
      - "draft/examples/**"
      - "draft/library/**"
      - "draft/server/**"
      - "draft/builtin/**"
      - "draft/stdlib/**"
      - "draft/src/library/**"
      - "draft/src/server/**"
      - "research/language-design/PROTOTYPES/CLI-WORKLOADS-01/run.py"
      - ".github/workflows/llmlang-linux-syscalls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Test the draft SPG library
        run: cargo +1.85.1 test --locked --manifest-path draft/library/Cargo.toml
      - name: Test and build the draft server
        run: |
          cargo +1.85.1 test --locked --manifest-path draft/server/Cargo.toml
          cargo +1.85.1 build --locked --manifest-path draft/server/Cargo.toml
      - name: Run draft native packages through MCP
        run: |
          export RUSTUP_TOOLCHAIN=1.85.1
          python -B draft/server/tests/native_build_e2e.py draft/server/target/debug/llmlang-server
