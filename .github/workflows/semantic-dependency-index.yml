name: Semantic dependency extractor prototype

on:
  workflow_call:
  push:
    paths:
      - "research/PROTOTYPES/DEPENDENCY-GRAPH-01/**"
      - ".github/workflows/semantic-dependency-index.yml"
  pull_request:
    paths:
      - "research/PROTOTYPES/DEPENDENCY-GRAPH-01/**"
      - ".github/workflows/semantic-dependency-index.yml"

jobs:
  semantic-dependency-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run semantic dependency extractor tests
        working-directory: research/PROTOTYPES/DEPENDENCY-GRAPH-01
        run: python -m unittest -v tests.test_impact_planning tests.test_semantic_dependency_index tests.test_semantic_graph tests.test_identity_lifecycle tests.test_call_site_refactor tests.test_recursive_identity tests.test_contract_model tests.test_candidate_validation tests.test_candidate_graph_audit tests.test_candidate_semantic_diff tests.test_candidate_semantic_diff_cip_v2
      - name: Compile semantic dependency extractor
        working-directory: research/PROTOTYPES/DEPENDENCY-GRAPH-01
        run: python -m py_compile src/impact_planning.py src/semantic_dependency_index.py src/semantic_graph.py src/identity_lifecycle.py src/call_site_refactor.py src/recursive_identity.py src/contract_model.py src/candidate_validation.py src/candidate_graph_audit.py src/candidate_semantic_diff.py tests/test_candidate_graph_audit.py tests/test_candidate_semantic_diff.py tests/test_candidate_semantic_diff_cip_v2.py tests/test_identity_lifecycle.py tests/test_call_site_refactor.py tests/test_recursive_identity.py tests/test_contract_model.py tests/test_impact_planning.py tests/test_semantic_dependency_index.py tests/test_semantic_graph.py tests/test_candidate_validation.py
