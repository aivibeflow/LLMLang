name: LLMLang scalar MVP

on:
  pull_request:
    paths:
      - "tools/llmlang_mvp/**"
      - "packages/linux.syscalls/provider/**"
      - "research/language-design/PROTOTYPES/CLI-WORKLOADS-01/**"
      - ".github/workflows/llmlang-mvp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install verification and compilation tools
        run: |
          dotnet tool install Boogie --version 3.5.5 --tool-path "$RUNNER_TEMP/boogie"
          python -m pip install z3-solver==4.13.3.0
          command -v z3
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          cargo fetch --locked --manifest-path tools/llmlang_mvp/stage0/Cargo.toml
          echo "$RUNNER_TEMP/boogie" >> "$GITHUB_PATH"
      - name: Build and test Stage 0 offline
        run: |
          cargo build --offline --locked --manifest-path tools/llmlang_mvp/stage0/Cargo.toml
          cargo test --offline --locked --manifest-path tools/llmlang_mvp/stage0/Cargo.toml
      - name: Check scalar model in Lean
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.36.0
          "$HOME/.elan/bin/lean" tools/llmlang_mvp/ScalarChecks.lean
      - name: Check review and verification controls
        run: |
          python -B -m tools.llmlang_mvp.controls
          python -B -m unittest -v tools.llmlang_mvp.test_contract_wire tools.llmlang_mvp.test_contract_profiles tools.llmlang_mvp.test_counterexamples
          python -B -m tools.llmlang_mvp review > "$RUNNER_TEMP/llmlang-review.txt"
          python -B -m tools.llmlang_mvp check > "$RUNNER_TEMP/llmlang-verification.json"
          python -B -m tools.llmlang_mvp.contract_profiles check \
            tools/llmlang_mvp/trace_examples/withdrawal.contract.json \
            tools/llmlang_mvp/trace_examples/withdrawal-failure.trace.json > "$RUNNER_TEMP/llmlang-trace.json"
      - name: Run RT-01 against both execution paths
        run: python -B -m tools.llmlang_mvp.conformance --report "$RUNNER_TEMP/llmlang-conformance.json"
      - uses: actions/upload-artifact@v4
        with:
          name: llmlang-mvp-evidence
          path: |
            ${{ runner.temp }}/llmlang-review.txt
            ${{ runner.temp }}/llmlang-verification.json
            ${{ runner.temp }}/llmlang-conformance.json
            ${{ runner.temp }}/llmlang-trace.json
