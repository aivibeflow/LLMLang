name: Required CI policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-policy:
    name: ci-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python tools/check_required_ci.py
