name: Repository structure

on:
  workflow_call:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test repository structure checker
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check all tracked Markdown is text
        run: python tools/check_markdown_text.py
      - name: Install pinned finite path solver dependency
        run: python -m pip install -r research/PROTOTYPES/RT-04-01/requirements-solver.txt
      - name: Test RT-04 prototype 01
        run: python -m unittest discover -s research/PROTOTYPES/RT-04-01 -p 'test_*.py' -v
      - name: Check tracked repository layout
        run: python tools/check_repo_structure.py
