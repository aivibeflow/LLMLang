name: Required CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logos-binding:
    uses: ./.github/workflows/logos-binding.yml
  package-identity:
    uses: ./.github/workflows/package-identity.yml
  package-index:
    uses: ./.github/workflows/package-index.yml
  qf-lia-profile:
    uses: ./.github/workflows/qf-lia-profile.yml
  repository-structure:
    uses: ./.github/workflows/repository-structure.yml
  semantic-dependency-index:
    uses: ./.github/workflows/semantic-dependency-index.yml
  toolchain-workspace:
    uses: ./.github/workflows/toolchain-workspace.yml

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs:
      - logos-binding
      - package-identity
      - package-index
      - qf-lia-profile
      - repository-structure
      - semantic-dependency-index
      - toolchain-workspace
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI suite to pass
        env:
          LOGOS_BINDING: ${{ needs.logos-binding.result }}
          PACKAGE_IDENTITY: ${{ needs.package-identity.result }}
          PACKAGE_INDEX: ${{ needs.package-index.result }}
          QF_LIA_PROFILE: ${{ needs.qf-lia-profile.result }}
          REPOSITORY_STRUCTURE: ${{ needs.repository-structure.result }}
          SEMANTIC_DEPENDENCY_INDEX: ${{ needs.semantic-dependency-index.result }}
          TOOLCHAIN_WORKSPACE: ${{ needs.toolchain-workspace.result }}
        run: |
          python - <<'PY'
          import os
          import sys

          results = {
              "logos-binding": os.environ["LOGOS_BINDING"],
              "package-identity": os.environ["PACKAGE_IDENTITY"],
              "package-index": os.environ["PACKAGE_INDEX"],
              "qf-lia-profile": os.environ["QF_LIA_PROFILE"],
              "repository-structure": os.environ["REPOSITORY_STRUCTURE"],
              "semantic-dependency-index": os.environ["SEMANTIC_DEPENDENCY_INDEX"],
              "toolchain-workspace": os.environ["TOOLCHAIN_WORKSPACE"],
          }
          failures = [
              f"{name}: {result}"
              for name, result in results.items()
              if result != "success"
          ]
          if failures:
              print("Required CI suites did not all succeed:")
              for failure in failures:
                  print(f" - {failure}")
              sys.exit(1)
          print("All required CI suites passed.")
          PY
