name: Proof Obligation Benchmark Smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/formal-verification/PROOF-OBLIGATION-BENCHMARK/**'
      - '.github/workflows/proof-obligation-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-oracle-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run recursive and higher-order contract generator
        run: |
          python3 research/formal-verification/PROOF-OBLIGATION-BENCHMARK/generative/recursive/test_recursive.py
          python3 research/formal-verification/PROOF-OBLIGATION-BENCHMARK/generative/recursive/generate.py --count 90 --seed 42 > pob-recursive-summary.json
      - name: Run finite reference and mutation controls
        run: |
          python3 research/formal-verification/PROOF-OBLIGATION-BENCHMARK/test_runner.py
          python3 research/formal-verification/PROOF-OBLIGATION-BENCHMARK/run.py run > pob-smoke.json
      - name: Run evidence composition controls
        run: python3 research/formal-verification/PROOF-OBLIGATION-BENCHMARK/evidence/test_composition.py
      - name: Run coverage inventory and deterministic generator
        run: |
          python3 research/formal-verification/PROOF-OBLIGATION-BENCHMARK/test_coverage_v2.py
          python3 research/formal-verification/PROOF-OBLIGATION-BENCHMARK/coverage_v2.py > pob-coverage-v2.json
          python3 research/formal-verification/PROOF-OBLIGATION-BENCHMARK/generative/test_generator.py
          python3 research/formal-verification/PROOF-OBLIGATION-BENCHMARK/generative/generate.py --count 10000 --seed 42 > pob-generated-summary.json
      - name: Run transition contract generator
        run: |
          python3 research/formal-verification/PROOF-OBLIGATION-BENCHMARK/generative/transition/test_transition.py
          python3 research/formal-verification/PROOF-OBLIGATION-BENCHMARK/generative/transition/test_symbolic_dual_check.py
          python3 research/formal-verification/PROOF-OBLIGATION-BENCHMARK/generative/transition/generate.py --count 1000 --seed 42 > pob-transition-summary.json
      - name: Run structural and system contract generator
        run: |
          python3 research/formal-verification/PROOF-OBLIGATION-BENCHMARK/generative/system/test_system.py
          python3 research/formal-verification/PROOF-OBLIGATION-BENCHMARK/generative/system/generate.py --count 140 --seed 42 > pob-system-summary.json
      - uses: actions/upload-artifact@v6
        with:
          name: pob-smoke
          path: |
            pob-recursive-summary.json
            pob-smoke.json
            pob-coverage-v2.json
            pob-generated-summary.json
            pob-transition-summary.json
            pob-system-summary.json
          if-no-files-found: error
