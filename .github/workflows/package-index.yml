name: Package index logical model

on:
  workflow_call:
    inputs:
      run_benchmark:
        description: Run the exploratory Provider resource benchmark
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_benchmark:
        description: Run the exploratory Provider resource benchmark
        required: false
        type: boolean
        default: false

jobs:
  package-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run logical index and archive tests
        working-directory: research/PROTOTYPES/PACKAGE-INDEX-01
        env:
          PYTHONPATH: ../PACKAGE-IDENTITY-01
        run: python run_tests_with_timings.py
      - name: Compile prototype and tests
        working-directory: research/PROTOTYPES/PACKAGE-INDEX-01
        env:
          PYTHONPATH: ../PACKAGE-IDENTITY-01
        run: python -m py_compile package_index.py test_package_index.py test_streaming_merge.py test_external_validation.py test_package_archive.py test_package_closure.py package_closure.py test_package_provider.py test_provider_stress.py package_provider.py benchmark_package_provider.py content_store.py test_content_store.py run_tests_with_timings.py ../PACKAGE-IDENTITY-01/package_identity.py
      - name: Record exploratory Provider resource benchmarks
        if: inputs.run_benchmark
        working-directory: research/PROTOTYPES/PACKAGE-INDEX-01
        env:
          PYTHONPATH: ../PACKAGE-IDENTITY-01
        run: python benchmark_package_provider.py --sizes 1000 5000
