name: Package index logical model

on:
  push:
    paths:
      - "research/PROTOTYPES/PACKAGE-INDEX-01/**"
      - "research/PACKAGE-INDEX-LOGICAL-SCHEMA.md"
      - ".github/workflows/package-index.yml"
  pull_request:
    paths:
      - "research/PROTOTYPES/PACKAGE-INDEX-01/**"
      - "research/PACKAGE-INDEX-LOGICAL-SCHEMA.md"
      - ".github/workflows/package-index.yml"

jobs:
  package-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run logical index tests
        working-directory: research/PROTOTYPES/PACKAGE-INDEX-01
        run: python -m unittest discover -v
      - name: Compile prototype and tests
        working-directory: research/PROTOTYPES/PACKAGE-INDEX-01
        run: python -m py_compile package_index.py test_package_index.py test_streaming_merge.py
