name: Package index logical model

on:
  push:
    paths:
      - "research/PROTOTYPES/PACKAGE-INDEX-01/**"
      - "research/PACKAGE-INDEX-LOGICAL-SCHEMA.md"
      - ".github/workflows/package-index.yml"
  pull_request:
    paths:
      - "research/PROTOTYPES/PACKAGE-INDEX-01/**"
      - "research/PACKAGE-INDEX-LOGICAL-SCHEMA.md"
      - ".github/workflows/package-index.yml"

jobs:
  package-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run logical index and archive tests
        working-directory: research/PROTOTYPES/PACKAGE-INDEX-01
        env:
          PYTHONPATH: ../PACKAGE-IDENTITY-01
        run: python -m unittest discover -v
      - name: Compile prototype and tests
        working-directory: research/PROTOTYPES/PACKAGE-INDEX-01
        env:
          PYTHONPATH: ../PACKAGE-IDENTITY-01
        run: python -m py_compile package_index.py test_package_index.py test_streaming_merge.py test_external_validation.py test_package_archive.py test_package_closure.py package_closure.py test_package_provider.py test_provider_stress.py package_provider.py benchmark_package_provider.py content_store.py test_content_store.py ../PACKAGE-IDENTITY-01/package_identity.py
      - name: Record exploratory Provider resource benchmarks
        working-directory: research/PROTOTYPES/PACKAGE-INDEX-01
        env:
          PYTHONPATH: ../PACKAGE-IDENTITY-01
        run: python benchmark_package_provider.py --sizes 1000 5000
