syntax = "proto3";

package llmlang.syscalls.storage.v1;

// Fields in an Object are unique and stored in increasing Unicode key order.
message Record {
  string key = 1;
  Object content = 2;
}

message Object {
  repeated Field fields = 1;
}

message Field {
  string key = 1;
  Value value = 2;
}

message List {
  repeated Value values = 1;
}

message Value {
  oneof kind {
    bool null_value = 1;
    bool bool_value = 2;
    sint64 int_value = 3;
    string string_value = 4;
    List list_value = 5;
    Object object_value = 6;
  }
}
